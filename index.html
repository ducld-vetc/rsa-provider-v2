
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VETC - Cổng Thông Tin Đại Lý</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900;1,14..32,400..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f3f4f6;
        }
        button, input, select, textarea, optgroup {
            font-family: inherit;
        }
        .max-w-7xl {
            max-width: unset !important;
        }
        div[class*="backdrop-blur"] {
            margin-top: 0 !important;
        }
        .vetc-green { color: #00A859; }
        .bg-vetc-green { background-color: #00A859; }
        .border-vetc-green { border-color: #00A859; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #00A859;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #008f4c;
        }

        .map-trip-tooltip.leaflet-tooltip {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }
        .map-trip-tooltip.leaflet-tooltip::before {
            display: none;
        }

        .rsa-dashboard-map .leaflet-marker-icon {
            background: transparent !important;
            border: none !important;
        }
        .rsa-dashboard-map .leaflet-marker-icon img {
            max-width: none !important;
            max-height: none !important;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .station-name-tooltip.leaflet-tooltip {
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.35;
            white-space: normal;
            max-width: 320px;
            width: max-content;
            overflow-wrap: anywhere;
            word-break: break-word;
            pointer-events: none;
        }
        .station-name-tooltip.leaflet-tooltip::before {
            border-top-color: #111827;
        }

        .station-heat-canvas {
            pointer-events: none;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .rsa-dashboard-map .leaflet-container {
            z-index: 0 !important;
        }
        .rsa-dashboard-map .leaflet-pane,
        .rsa-dashboard-map .leaflet-top,
        .rsa-dashboard-map .leaflet-bottom {
            z-index: 1 !important;
        }
        .rsa-dashboard-map .leaflet-tooltip-pane {
            z-index: 2 !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
